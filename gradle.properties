org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Duser.home=/data/user/0/io.github.jackwener.dsh/files/home
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# On arm64 Linux hosts (no x86_64 aapt2), pass -Pandroid.aapt2FromMavenOverride=<path to an arm64 aapt2>.

# arm64 build on the phone: Kotlin runs inside the Gradle JVM (no second daemon).
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
