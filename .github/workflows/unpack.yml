name: Unpack source zip

on:
  push:
    paths:
      - 'DSH-Android-xk-repo.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into repository root
        run: |
          unzip -o DSH-Android-xk-repo.zip -d .
          rm -f DSH-Android-xk-repo.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import source code from DSH-Android-xk-repo.zip" || echo "Nothing to commit"
          git push
